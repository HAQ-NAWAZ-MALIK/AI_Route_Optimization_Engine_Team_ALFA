name: Build & Deploy (alpha)

# Builds the app + MCP images (mirroring k8s/build-and-push.sh), pushes them to
# the private registry, and rolls the deployments in the `alpha` namespace using
# the KUBECONFIG repository secret.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to build/deploy (defaults to the commit SHA)"
        required: false

concurrency:
  group: deploy-alpha
  cancel-in-progress: false

env:
  IMAGE_REPO: ${{ secrets.REGISTRY_SERVER }}/route-optimizer
  NAMESPACE: alpha

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: meta
        run: echo "tag=${{ inputs.tag || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # --- App image: Next.js standalone (UI + /api) ---
      - name: Build & push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_MAPBOX_TOKEN=${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
          tags: |
            ${{ env.IMAGE_REPO }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- MCP image: Express MCP HTTP server ---
      - name: Build & push MCP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./k8s/mcp-server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}-mcp:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_REPO }}-mcp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "${{ secrets.KUBECONFIG }}" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Deploy (rolling update to the built tag)
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          kubectl -n "$NAMESPACE" set image deployment/route-optimizer \
            app="${IMAGE_REPO}:${TAG}"
          kubectl -n "$NAMESPACE" set image deployment/route-optimizer-mcp \
            mcp="${IMAGE_REPO}-mcp:${TAG}"
          kubectl -n "$NAMESPACE" rollout status deployment/route-optimizer --timeout=180s
          kubectl -n "$NAMESPACE" rollout status deployment/route-optimizer-mcp --timeout=180s
