# ============================================================================
# Prometheus Alerting Rules for Route Optimizer
# ============================================================================
# 
# Deploy with: kubectl apply -f alerting-rules.yaml
# Requires Prometheus Operator or similar to consume

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: route-optimizer-alerts
  labels:
    app: route-optimizer
spec:
  groups:
    - name: route-optimizer.rules
      rules:
        # ====================================================================
        # Availability Alerts
        # ====================================================================
        
        - alert: RouteOptimizerDown
          expr: up{job="route-optimizer"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Route Optimizer is down"
            description: "Route Optimizer instance {{ $labels.instance }} has been down for more than 1 minute."

        - alert: RouteOptimizerHighRestartRate
          expr: increase(kube_pod_container_status_restarts_total{container="route-optimizer"}[1h]) > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Route Optimizer pod restarting frequently"
            description: "Pod {{ $labels.pod }} has restarted {{ $value }} times in the last hour."

        # ====================================================================
        # Error Rate Alerts
        # ====================================================================
        
        - alert: RouteOptimizerHighErrorRate
          expr: |
            (
              sum(rate(http_errors_total{job="route-optimizer"}[5m]))
              /
              sum(rate(http_requests_total{job="route-optimizer"}[5m]))
            ) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Route Optimizer high error rate"
            description: "Error rate is {{ $value | humanizePercentage }} (threshold: 5%)"

        - alert: RouteOptimizerCriticalErrorRate
          expr: |
            (
              sum(rate(http_errors_total{job="route-optimizer"}[5m]))
              /
              sum(rate(http_requests_total{job="route-optimizer"}[5m]))
            ) > 0.15
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Route Optimizer critical error rate"
            description: "Error rate is {{ $value | humanizePercentage }} (threshold: 15%)"

        # ====================================================================
        # Latency Alerts
        # ====================================================================
        
        - alert: RouteOptimizerHighLatency
          expr: |
            histogram_quantile(0.95, 
              sum(rate(http_request_duration_seconds_bucket{job="route-optimizer"}[5m])) by (le)
            ) > 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Route Optimizer high latency"
            description: "P95 latency is {{ $value }}s (threshold: 5s)"

        - alert: RouteOptimizerOptimizationSlow
          expr: |
            histogram_quantile(0.95, 
              sum(rate(optimization_duration_seconds_bucket{job="route-optimizer"}[5m])) by (le)
            ) > 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Route optimization taking too long"
            description: "P95 optimization duration is {{ $value }}s (threshold: 10s)"

        # ====================================================================
        # Resource Alerts
        # ====================================================================
        
        - alert: RouteOptimizerHighMemory
          expr: |
            container_memory_working_set_bytes{container="route-optimizer"}
            /
            container_spec_memory_limit_bytes{container="route-optimizer"}
            > 0.85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Route Optimizer high memory usage"
            description: "Memory usage is {{ $value | humanizePercentage }} of limit"

        - alert: RouteOptimizerHighCPU
          expr: |
            rate(container_cpu_usage_seconds_total{container="route-optimizer"}[5m])
            /
            container_spec_cpu_quota{container="route-optimizer"}
            * 100000
            > 0.85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Route Optimizer high CPU usage"
            description: "CPU usage is {{ $value | humanizePercentage }} of limit"
