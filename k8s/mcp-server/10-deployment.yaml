# ============================================================================
# MCP Server Deployment — HTTP MCP endpoint (POST /mcp) + REST tool API.
# Built from the repo root so it can load the parent app's src/lib engine.
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: route-optimizer-mcp
  namespace: alpha
  labels:
    app.kubernetes.io/name: route-optimizer-mcp
    app.kubernetes.io/part-of: route-optimizer
    app.kubernetes.io/component: mcp-server
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: route-optimizer-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: route-optimizer-mcp
        app.kubernetes.io/part-of: route-optimizer
        app.kubernetes.io/component: mcp-server
    spec:
      imagePullSecrets:
        - name: docker-registry-auth
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: mcp
          image: registry.kube.nikhilbhatia.com/route-optimizer-mcp:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: mcp-config
            - secretRef:
                name: mcp-secrets
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      terminationGracePeriodSeconds: 30
