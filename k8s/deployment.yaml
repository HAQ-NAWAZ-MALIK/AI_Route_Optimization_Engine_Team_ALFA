# ============================================================================
# AI Transport Optimizer - Kubernetes Deployment
# ============================================================================
# Production deployment with 3 replicas, resource limits, and probes

apiVersion: apps/v1
kind: Deployment
metadata:
  name: route-optimizer
  labels:
    app: route-optimizer
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: route-optimizer
  template:
    metadata:
      labels:
        app: route-optimizer
        version: v1
    spec:
      containers:
        - name: optimizer
          image: routify/ai-transport-optimizer:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          
          # Resource limits
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          
          # Environment variables
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            
            # Redis connection (from secret)
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: optimizer-secrets
                  key: redis-url
                  optional: true
            
            # Cache configuration
            - name: CACHE_LOCAL_TTL
              value: "300"
            - name: CACHE_REDIS_TTL
              value: "86400"
            - name: CACHE_MAX_ENTRIES
              value: "1000"
            
            # Optional API keys (from secrets)
            - name: MAPBOX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: optimizer-secrets
                  key: mapbox-token
                  optional: true
            - name: TOMTOM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: optimizer-secrets
                  key: tomtom-api-key
                  optional: true
          
          # Liveness probe - checks if the container is alive
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          # Readiness probe - checks if the container can receive traffic
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          
          # Security context
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      
      # Pod security
      securityContext:
        fsGroup: 1001
      
      # Graceful shutdown
      terminationGracePeriodSeconds: 30
