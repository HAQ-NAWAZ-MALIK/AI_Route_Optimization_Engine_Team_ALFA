# ============================================================================
# App Deployment — Next.js standalone image serving both the UI (/) and the
# API (/api/*). This is the whole application in one deployment.
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: route-optimizer
  namespace: alpha
  labels:
    app.kubernetes.io/name: route-optimizer
    app.kubernetes.io/part-of: route-optimizer
    app.kubernetes.io/component: app
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: route-optimizer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: route-optimizer
        app.kubernetes.io/part-of: route-optimizer
        app.kubernetes.io/component: app
    spec:
      imagePullSecrets:
        - name: docker-registry-auth
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: app
          image: registry.kube.nikhilbhatia.com/route-optimizer:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "1536Mi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      terminationGracePeriodSeconds: 30
