# ============================================================================
# App Ingress — routes the whole host (UI + /api) to the single app service.
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: route-optimizer
  namespace: alpha
  labels:
    app.kubernetes.io/name: route-optimizer
    app.kubernetes.io/part-of: route-optimizer
    app.kubernetes.io/component: app
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - route-optimizer.nikhilbhatia.com
      secretName: route-optimizer-tls
  rules:
    - host: route-optimizer.nikhilbhatia.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: route-optimizer
                port:
                  number: 80
