# ============================================================================
# AI Transport Optimizer - Kubernetes Service
# ============================================================================
# ClusterIP service for internal load balancing

apiVersion: v1
kind: Service
metadata:
  name: route-optimizer
  labels:
    app: route-optimizer
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: route-optimizer

---
