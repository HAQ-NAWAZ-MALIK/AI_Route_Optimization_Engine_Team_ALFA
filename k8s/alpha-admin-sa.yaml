apiVersion: v1
kind: ServiceAccount
metadata:
  name: alpha-admin
  namespace: alpha
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alpha-admin
  namespace: alpha
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: alpha-admin
    namespace: alpha
---
# Static, non-expiring token for the service account (legacy long-lived token).
apiVersion: v1
kind: Secret
metadata:
  name: alpha-admin-token
  namespace: alpha
  annotations:
    kubernetes.io/service-account.name: alpha-admin
type: kubernetes.io/service-account-token
